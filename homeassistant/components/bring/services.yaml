send_message:
  target:
    entity:
      domain: todo
      integration: bring
  fields:
    message:
      example: urgent_message
      required: true
      default: "going_shopping"
      selector:
        select:
          translation_key: "notification_type_selector"
          options:
            - "going_shopping"
            - "changed_list"
            - "shopping_done"
            - "urgent_message"
    item:
      example: Cilantro
      required: false
      selector:
        text:
import_recipe:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bring
    recipe_url:
      required: true
      selector:
        text:
