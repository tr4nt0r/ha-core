publish:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: notify
            integration: ntfy
      example: notify.mytopic
    title:
      required: false
      selector:
        text:
      example: Hello
    message:
      required: false
      selector:
        text:
          multiline: true
      example: World
    markdown:
      required: false
      selector:
        constant:
          value: true
          label: ""
      example: true
    tags:
      required: false
      selector:
        text:
          multiple: true
      example: '["partying_face", "grin"]'
    priority:
      required: false
      selector:
        select:
          options:
            - value: "5"
              label: "max"
            - value: "4"
              label: "high"
            - value: "3"
              label: "default"
            - value: "2"
              label: "low"
            - value: "1"
              label: "min"
          mode: dropdown
          translation_key: "priority"
          sort: false
      example: "5"
    click:
      required: false
      selector:
        text:
          type: url
          autocomplete: url
      example: https://example.org
    delay:
      required: false
      selector:
        duration:
          enable_day: true
      example: '{"seconds": 30}'
    attach:
      required: false
      selector:
        text:
          type: url
          autocomplete: url
      example: https://example.org/download.zip
    email:
      required: false
      selector:
        text:
          type: email
          autocomplete: email
      example: mail@example.org
    call:
      required: false
      selector:
        text:
          type: tel
          autocomplete: tel
      example: "1234567890"
    icon:
      required: false
      selector:
        text:
          type: url
          autocomplete: url
      example: https://example.org/logo.png
    actions:
      collapsed: true
      fields:
        action1:
          default:
            action: http
            label: Close door
            url: https://api.mygarage.local/
            method: POST
            headers: { "Authorization": "Bearer zAzsx1sk.." }
            body: '{"action": "close"}'
            clear: true
          required: false
          selector:
            object:
              label_field: "label"
              description_field: "action"
              multiple: false
              fields:
                action:
                  label: Action
                  selector:
                    select:
                      options:
                        - value: http
                          label: HTTP
                        - value: view
                          label: View
                        - value: broadcast
                          label: Broadcast
                      mode: dropdown
                      sort: true
                label:
                  label: Label
                  selector:
                    text:
                percentage:
                  label: Percentage
                  selector:
                    number:
                      unit_of_measurement: "%"
        action2:
          default:
            action: view
            label: View camera
            url: https://mycamera.local/
            clear: true
          required: false
          selector:
            object:
        action3:
          default:
            action: broadcast
            label: Take picture
            intent: io.heckel.ntfy.USER_ACTION
            extras: { "cmd": "pic", "camera": "front" }
            clear: true
          required: false
          selector:
            object:
